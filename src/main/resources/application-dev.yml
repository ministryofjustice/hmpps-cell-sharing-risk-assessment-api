hmpps-auth:
  url: ${HMPPS_AUTH_URL:http://localhost:8090/auth}

prison-register:
  url: ${PRISON_REGISTER_URL:http://localhost:8091}

prisoner-search:
  url: ${PRISONER_SEARCH_API_URL:http://localhost:8092}

prison-api:
  url: ${PRISON_API_URL:http://localhost:8093}

system:
  client:
    id: ${SYSTEM_CLIENT_ID:cell-sharing-client}
    secret: ${SYSTEM_CLIENT_SECRET:clientsecret}

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/cell_sharing_risk_assessment?sslmode=prefer
    username: cell_sharing_risk_assessment
    password: cell_sharing_risk_assessment

  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: false
        format_sql: false