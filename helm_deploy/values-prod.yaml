---
# Per environment values which override defaults in hmpps-cell-sharing-risk-assessment-api/values.yaml

generic-service:
  replicaCount: 1 # not in use yet
  ingress:
    host: cell-sharing-risk-assessment-api.hmpps.service.justice.gov.uk

  env:
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    PRISON_REGISTER_URL: "https://prison-register.hmpps.service.justice.gov.uk"
    PRISONER_SEARCH_URL: "https://prisoner-search.prison.service.justice.gov.uk"
    PRISON_API_URL: "https://prison-api.prison.service.justice.gov.uk"

  namespace_secrets:
    hmpps-domain-events-topic:
      HMPPS_SQS_TOPICS_DOMAINEVENTS_ARN: "topic_arn"
    sqs-hmpps-audit-secret:
      HMPPS_SQS_QUEUES_AUDIT_QUEUE_NAME: "sqs_queue_name"
    sqs-prisoner-event-queue-secret:
      HMPPS_SQS_QUEUES_CSRA_QUEUE_NAME: "sqs_queue_name"
    sqs-prisoner-event-queue-dlq-secret:
      HMPPS_SQS_QUEUES_CSRA_DLQ_NAME: "sqs_queue_name"

  # Copies the production database into preprod whenever preprod NOMIS has been refreshed, which is
  # roughly every two weeks. The CronJob runs in the production namespace so that the production
  # credentials never leave it; the preprod credentials are placed here by cloud-platform-environments
  # (rds-postgresql.tf in hmpps-cell-sharing-risk-assessment-preprod). MAPA-392.
  postgresDatabaseRestore:
    enabled: true
    # The generated name, hmpps-cell-sharing-risk-assessment-api-postgres-restore, is 55 characters
    # and Kubernetes allows a CronJob no more than 52, so it is set explicitly here.
    jobName: csra-api-postgres-restore
    namespace_secrets:
      rds-postgresql-instance-output:
        DB_NAME: "database_name"
        DB_USER: "database_username"
        DB_PASS: "database_password"
        DB_HOST: "rds_instance_address"
      rds-postgresql-instance-output-preprod:
        DB_NAME_PREPROD: "database_name"
        DB_USER_PREPROD: "database_username"
        DB_PASS_PREPROD: "database_password"
        DB_HOST_PREPROD: "rds_instance_address"

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: move-a-prisoner-alerts-prod
